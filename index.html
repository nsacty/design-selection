<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パンフレット評価アンケート</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f5f5f0;
      color: #222;
    }

    .screen { display: none; }

    /* ===== トップ ===== */
    #screen-top.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    #screen-top h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.75rem; }
    #screen-top p { color: #666; font-size: 0.88rem; line-height: 1.8; margin-bottom: 2rem; }

    /* ===== シナリオ説明 ===== */
    #screen-scenario-a.active,
    #screen-scenario-b.active {
      display: block;
      padding: 2rem 1.25rem;
    }
    .scenario-intro-label {
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 0.75rem;
    }
    .scenario-intro-text {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      font-size: 0.9rem;
      line-height: 1.8;
      color: #333;
      border: 1px solid #e8e8e0;
      white-space: pre-wrap;
      margin-bottom: 1.5rem;
    }

    /* ===== 対戦画面 ===== */
    #screen-battle.active { display: block; }
    #screen-battle {
      padding-top: 80px;
      padding-bottom: 148px;
    }

    /* 上部固定 */
    .battle-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #fff;
      border-bottom: 1px solid #e8e8e0;
      padding: 0.6rem 1rem;
      z-index: 100;
    }
    .battle-header-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.3rem;
    }
    .battle-digest {
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
    }
    .battle-progress { font-size: 0.78rem; color: #999; }
    .btn-back {
      font-size: 0.72rem;
      color: #999;
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
    }
    .btn-back:disabled { opacity: 0; pointer-events: none; }

    /* 対戦コンテンツ */
    .battle-content { padding: 1rem 0; }
    .battle-guide {
      font-size: 0.75rem;
      color: #999;
      text-align: center;
      margin-bottom: 0.6rem;
      padding: 0 1rem;
    }
    .battle-pair {
      display: flex;
      flex-direction: row;
      gap: 0.75rem;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 0 1rem 0.75rem;
      scrollbar-width: none;
    }
    .battle-pair::-webkit-scrollbar { display: none; }
    /* PC幅制限ラッパー */
    .battle-inner { max-width: 600px; margin: 0 auto; }
    .battle-item {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #e8e8e0;
      flex: 0 0 85%;
      scroll-snap-align: center;
    }
    .battle-item-label {
      padding: 0.55rem 1rem;
      font-size: 0.82rem;
      color: #555;
      font-weight: 500;
      border-bottom: 1px solid #f0f0e8;
    }
    .battle-item img { width: 100%; display: block; cursor: pointer; }

    /* 全画面オーバーレイ */
    .fullscreen-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    .fullscreen-overlay.active { display: flex; }
    .fullscreen-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* 下部固定 */
    .battle-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #e8e8e0;
      padding: 0.75rem 1rem;
      z-index: 100;
    }
    .battle-footer-label {
      font-size: 0.75rem;
      color: #999;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .choice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-choice {
      padding: 0.6rem 0.4rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 0.8rem;
      color: #555;
      cursor: pointer;
      transition: all 0.12s;
      text-align: center;
      line-height: 1.3;
    }
    .btn-choice.selected { border-color: #222; background: #222; color: #fff; }
    .btn-decide {
      width: 100%;
      padding: 0.72rem;
      background: #ccc;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: not-allowed;
      transition: background 0.15s;
    }
    .btn-decide.enabled { background: #222; cursor: pointer; }

    /* ===== 完了 ===== */
    #screen-done.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    #screen-done h2 { font-size: 1.2rem; margin-bottom: 0.75rem; }
    #screen-done p { color: #666; font-size: 0.9rem; line-height: 1.7; }

    /* 共通ボタン */
    .btn-primary {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding: 1rem;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ===================== -->
<!-- 設定（ここを編集）      -->
<!-- ===================== -->
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzcFg7Yrip0ZQEgrm8XxFzhA2t1-5w5eIq_giH6HcRB_6Hvg5ohhQlOYbUcs7uDS7Pbtw/exec';

const IMAGES = [
  'images/pattern1.jpg',
  'images/pattern2.jpg',
  'images/pattern3.jpg',
  'images/pattern4.jpg',
  'images/pattern5.jpg'
];
const LABELS = ['パターン1', 'パターン2', 'パターン3', 'パターン4', 'パターン5'];

const SCENARIO_A_LONG  = 'あなたは病院の受付スタッフです。外から来た営業の方が、パンフレットを持ってきて「先生にお渡しください」と言っています。\n\n2枚ずつ比べながら、先生に渡したい思うものを選んでください。';
const SCENARIO_A_SHORT = '先生に渡したいのはどちら？';
const SCENARIO_B_LONG  = 'あなたは病院の待合室で順番を待っている患者です。待合室にパンフレットが置いてあります。\n\n手に取って読んでみたいと思うものを選んでください。';
const SCENARIO_B_SHORT = '手に取りたいのはどちら？';
</script>

<!-- トップ -->
<div id="screen-top" class="screen active">
  <h1>パンフレット評価アンケート</h1>
  <p>2つのシナリオにお答えください。<br>所要時間：約3〜5分</p>
  <button class="btn-primary" onclick="gotoScenario('a')">評価を始める</button>
</div>

<!-- シナリオA説明 -->
<div id="screen-scenario-a" class="screen">
  <div class="scenario-intro-label">シナリオ 1 / 2</div>
  <div class="scenario-intro-text" id="text-scenario-a"></div>
  <button class="btn-primary" onclick="startBattle('a')">始める</button>
</div>

<!-- シナリオB説明 -->
<div id="screen-scenario-b" class="screen">
  <div class="scenario-intro-label">シナリオ 2 / 2</div>
  <div class="scenario-intro-text" id="text-scenario-b"></div>
  <button class="btn-primary" onclick="startBattle('b')">始める</button>
</div>

<!-- 対戦画面 -->
<div id="screen-battle" class="screen">
  <div class="battle-header">
    <div class="battle-inner">
      <div class="battle-header-row1">
        <span class="battle-digest" id="battle-digest"></span>
        <span class="battle-progress" id="battle-progress"></span>
      </div>
      <button class="btn-back" id="btn-back" onclick="goBack()">◀ 前の問に戻る</button>
    </div>
  </div>

  <div class="battle-content">
    <div class="battle-guide">← 横にスクロールできます　　画像をタップすると拡大できます</div>
    <div class="battle-pair" id="battle-pair"></div>
  </div>

  <div class="battle-footer">
    <div class="battle-inner">
      <div class="battle-footer-label">どちらが良いですか？</div>
      <div class="choice-buttons">
        <button class="btn-choice" id="btn-choice-0" onclick="selectChoice(0)"></button>
        <button class="btn-choice" id="btn-choice-1" onclick="selectChoice(1)"></button>
      </div>
      <button class="btn-decide" id="btn-decide" onclick="decide()" disabled>決定</button>
    </div>
  </div>
</div>

<!-- 完了 -->
<div id="screen-done" class="screen">
  <h2>ありがとうございました</h2>
  <p>回答を受け付けました。<br>ブラウザを閉じていただいてかまいません。</p>
</div>

<!-- 全画面オーバーレイ -->
<div class="fullscreen-overlay" id="fullscreen-overlay" onclick="closeFullscreen()">
  <img id="fullscreen-img" src="" alt="">
</div>

<script>
let currentScenario = '';
let order = [];
let currentQ = 0;
let currentWinner = -1;
let selectedChoice = -1;
let history = [];
let resultA = -1;
let resultB = -1;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function gotoScenario(scenario) {
  if (scenario === 'a') {
    document.getElementById('text-scenario-a').textContent = SCENARIO_A_LONG;
    showScreen('screen-scenario-a');
  } else {
    document.getElementById('text-scenario-b').textContent = SCENARIO_B_LONG;
    showScreen('screen-scenario-b');
  }
}

function startBattle(scenario) {
  currentScenario = scenario;
  order = shuffle([0, 1, 2, 3, 4]);
  currentQ = 0;
  currentWinner = order[0];
  selectedChoice = -1;
  history = [];
  renderBattle();
  showScreen('screen-battle');
}

function renderBattle() {
  document.getElementById('battle-digest').textContent =
    currentScenario === 'a' ? SCENARIO_A_SHORT : SCENARIO_B_SHORT;
  document.getElementById('battle-progress').textContent = `${currentQ + 1} / 4`;

  const idxA = currentWinner;
  const idxB = order[currentQ + 1];

  const pair = document.getElementById('battle-pair');
  pair.innerHTML = '';
  [idxA, idxB].forEach(idx => {
    const item = document.createElement('div');
    item.className = 'battle-item';

    const lbl = document.createElement('div');
    lbl.className = 'battle-item-label';
    lbl.textContent = LABELS[idx];

    const img = document.createElement('img');
    img.src = IMAGES[idx];
    img.alt = LABELS[idx];
    img.onclick = () => openFullscreen(IMAGES[idx]);

    item.appendChild(lbl);
    item.appendChild(img);
    pair.appendChild(item);
  });

  document.getElementById('btn-choice-0').textContent = LABELS[idxA];
  document.getElementById('btn-choice-1').textContent = LABELS[idxB];
  document.getElementById('btn-choice-0').classList.remove('selected');
  document.getElementById('btn-choice-1').classList.remove('selected');

  if (selectedChoice !== -1) {
    document.getElementById(`btn-choice-${selectedChoice}`).classList.add('selected');
    setDecideEnabled(true);
  } else {
    setDecideEnabled(false);
  }

  document.getElementById('btn-back').disabled = (currentQ === 0);
  window.scrollTo(0, 0);
}

function selectChoice(pos) {
  selectedChoice = pos;
  document.getElementById('btn-choice-0').classList.toggle('selected', pos === 0);
  document.getElementById('btn-choice-1').classList.toggle('selected', pos === 1);
  setDecideEnabled(true);
}

function setDecideEnabled(enabled) {
  const btn = document.getElementById('btn-decide');
  btn.classList.toggle('enabled', enabled);
  btn.disabled = !enabled;
}

function decide() {
  if (selectedChoice === -1) return;
  history.push({ winner: currentWinner, selectedChoice });

  const idxA = currentWinner;
  const idxB = order[currentQ + 1];
  const newWinner = selectedChoice === 0 ? idxA : idxB;

  currentQ++;
  selectedChoice = -1;

  if (currentQ === 4) {
    if (currentScenario === 'a') {
      resultA = newWinner;
      gotoScenario('b');
    } else {
      resultB = newWinner;
      submitAndDone();
    }
  } else {
    currentWinner = newWinner;
    renderBattle();
  }
}

function goBack() {
  if (currentQ === 0) return;
  const prev = history.pop();
  currentQ--;
  currentWinner = prev.winner;
  selectedChoice = prev.selectedChoice;
  renderBattle();
}

function openFullscreen(src) {
  document.getElementById('fullscreen-img').src = src;
  document.getElementById('fullscreen-overlay').classList.add('active');
}
function closeFullscreen() {
  document.getElementById('fullscreen-overlay').classList.remove('active');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function submitAndDone() {
  showScreen('screen-done');
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ resultA: resultA + 1, resultB: resultB + 1 }),
    mode: 'no-cors'
  }).catch(() => {});
}
</script>

</body>
</html>
