<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者集計</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f5f5f0;
      color: #222;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 540px; margin: 0 auto; }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    /* ログインフォーム */
    #login-section {
      background: #fff;
      border-radius: 10px;
      padding: 1.5rem;
      border: 1px solid #e8e8e0;
    }
    #login-section p {
      font-size: 0.88rem;
      color: #555;
      margin-bottom: 1rem;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="password"] {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    input[type="password"]:focus { border-color: #888; }
    .btn {
      padding: 0.6rem 1.2rem;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn:active { opacity: 0.8; }
    .error-msg {
      color: #c00;
      font-size: 0.82rem;
      margin-top: 0.6rem;
    }

    /* 集計セクション */
    #stats-section { display: none; }

    .count-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 1.5rem;
    }
    .count-label strong { color: #222; font-size: 1rem; }

    .chart-section {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      border: 1px solid #e8e8e0;
      margin-bottom: 1rem;
    }
    .chart-section h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .chart-section .subtitle {
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 1.25rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.75rem;
    }
    .bar-label {
      width: 80px;
      font-size: 0.82rem;
      color: #555;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      flex: 1;
      background: #eee;
      border-radius: 4px;
      height: 22px;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      background: #222;
      transition: width 0.5s ease;
      min-width: 2px;
    }
    .bar-fill.top { background: #2a6; }
    .bar-score {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.78rem;
      color: #fff;
      font-weight: 600;
    }
    .bar-score.outside {
      position: static;
      transform: none;
      color: #555;
      font-size: 0.78rem;
    }

    .reload-btn {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.7rem;
      background: #fff;
      color: #222;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }
    .reload-btn:active { background: #f0f0f0; }

    .loading {
      text-align: center;
      color: #999;
      font-size: 0.88rem;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

<!-- ===================== -->
<!-- 設定（ここを編集）      -->
<!-- ===================== -->
<script>
const GAS_URL = 'YOUR_GAS_URL_HERE';

const LABELS = [
  'パターン1',
  'パターン2',
  'パターン3',
  'パターン4',
  'パターン5'
];
</script>

<div class="container">
  <h1>パンフレット評価 — 集計</h1>

  <!-- ログイン -->
  <div id="login-section">
    <p>管理者パスワードを入力してください</p>
    <div class="input-row">
      <input type="password" id="pw-input" placeholder="パスワード"
             onkeydown="if(event.key==='Enter') login()">
      <button class="btn" onclick="login()">確認</button>
    </div>
    <div class="error-msg" id="login-error"></div>
  </div>

  <!-- 集計 -->
  <div id="stats-section">
    <div class="loading" id="loading-msg">読み込み中...</div>

    <div id="stats-content" style="display:none;">
      <p class="count-label">回答数：<strong id="count-display">0</strong> 件</p>

      <div class="chart-section">
        <h2>シナリオ A</h2>
        <div class="subtitle">受付スタッフとして先生に渡したい順</div>
        <div id="chart-a"></div>
      </div>

      <div class="chart-section">
        <h2>シナリオ B</h2>
        <div class="subtitle">待合室の患者として手に取りたい順</div>
        <div id="chart-b"></div>
      </div>

      <button class="reload-btn" onclick="loadStats()">再読み込み</button>
    </div>
  </div>
</div>

<script>
let currentPassword = '';

function login() {
  const pw = document.getElementById('pw-input').value.trim();
  if (!pw) return;
  currentPassword = pw;
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('stats-section').style.display = 'block';
  loadStats();
}

function loadStats() {
  document.getElementById('loading-msg').style.display = 'block';
  document.getElementById('stats-content').style.display = 'none';

  const url = GAS_URL + '?action=stats&password=' + encodeURIComponent(currentPassword);

  fetch(url)
    .then(r => r.json())
    .then(data => {
      document.getElementById('loading-msg').style.display = 'none';

      if (data.status === 'auth_error') {
        document.getElementById('stats-section').style.display = 'none';
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('login-error').textContent = 'パスワードが違います';
        return;
      }

      if (data.status !== 'ok') {
        document.getElementById('loading-msg').textContent = 'データの取得に失敗しました';
        document.getElementById('loading-msg').style.display = 'block';
        return;
      }

      document.getElementById('count-display').textContent = data.count;
      renderChart('chart-a', data.statsA);
      renderChart('chart-b', data.statsB);
      document.getElementById('stats-content').style.display = 'block';
    })
    .catch(() => {
      document.getElementById('loading-msg').textContent = 'データの取得に失敗しました';
    });
}

function renderChart(containerId, scores) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  const maxScore = Math.max(...scores, 1);
  const topIdx   = scores.indexOf(Math.max(...scores));

  scores.forEach((score, i) => {
    const pct    = Math.round((score / maxScore) * 100);
    const isTop  = i === topIdx;
    const isWide = pct >= 20; // バー内にスコアを表示できる幅かどうか

    const row = document.createElement('div');
    row.className = 'bar-row';

    row.innerHTML = `
      <div class="bar-label" title="${LABELS[i]}">${LABELS[i]}</div>
      <div class="bar-track">
        <div class="bar-fill${isTop ? ' top' : ''}" style="width:${pct}%">
          ${isWide ? `<span class="bar-score">${score}</span>` : ''}
        </div>
      </div>
      ${!isWide ? `<span class="bar-score outside">${score}</span>` : ''}
    `;
    container.appendChild(row);
  });
}
</script>

</body>
</html>
